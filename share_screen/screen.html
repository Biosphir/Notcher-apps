<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #080808; color: #f5f5f5; font: 14px "Segoe UI", sans-serif; padding: 0; }
h1 { font-size: 24px; margin: 0 0 8px; }
p { color: #aaa; line-height: 1.5; margin: 8px 0 16px; }
button { background: #252525; color: #f5f5f5; border: 1px solid #454545; border-radius: 6px; padding: 9px 13px; cursor: pointer; }
button:hover { background: #353535; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: #a73a93; border-color: #a73a93; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
label { display: block; color: #ccc; margin-bottom: 6px; }
textarea { width: 100%; min-height: 76px; resize: vertical; background: #171717; color: #eee; border: 1px solid #383838; border-radius: 6px; padding: 9px; font: 12px monospace; }
textarea:focus { outline: 1px solid #a73a93; }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; }
#status { color: #aaa; min-height: 24px; }
#video:focus-visible { outline: 2px solid #be60aa; }
video { width: 100%; background: #111; border-radius: 8px; max-height: 72vh; }
section[hidden], div[hidden], button[hidden] { display: none; }
#outbox, #accountInbox { margin-top: 16px; }
#invites { display: grid; gap: 8px; margin-bottom: 12px; }
#accountNotice { margin: 4px 0 8px; }
#out { min-height: 95px; margin-bottom: 8px; }
@media (max-width: 720px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<p id="intro">Share a display or window using invitation and response codes.</p>
<div class="actions">
<button id="share">Share with a code</button>
<button id="accountShare" class="primary" hidden>Share with my devices</button>
<button id="join">Join with a code</button>
<button id="stop" hidden>Stop session</button>
</div>
<div id="status" role="status" aria-live="polite">Ready</div>
<main>
<section>
<div id="accountInbox" hidden>
<strong>Invitations from your devices</strong>
<p id="accountNotice" role="status"></p>
<div id="invites"></div>
</div>
<div id="inbox" hidden>
<label id="inputLabel" for="incoming">Invitation code</label>
<textarea id="incoming" spellcheck="false" placeholder="Paste the other user's code"></textarea>
<button id="apply" style="margin-top:8px">Create response</button>
</div>
<div id="outbox" hidden>
<label id="outputLabel" for="out">Your code</label>
<textarea id="out" readonly spellcheck="false"></textarea>
<button id="copy">Copy code</button>
<p id="instructions"></p>
</div>
</section>
<section>
<video id="video" autoplay playsinline controls tabindex="0"></video>
<button id="controlFocus" hidden>Use mouse and keyboard</button>
<p id="videoCaption">Open Share Screen on both devices to connect through your account, or use a code.</p>
</section>
</main>
<!-- webchannel -->
<script>
"use strict";
const element = id => document.getElementById(id);
let peer = null;
let stream = null;
let control = null;
let mode = null;
let busy = false;
let generation = 0;
let accountBridge = null;
let remoteInput = null;
let viewerReady = false;
let viewerGrant = "";
let viewerDriving = false;
let movePending = false;
let latestMove = null;

let account = null;
let accountAvailable = false;
let accountInvites = [];
let accountSession = null;
let refreshing = false;
let requestId = 0;
const requests = new Map();
const defaultCaption = "Open Share Screen on both devices to connect through your account, or use a code.";

function signal(action, args = {}) {
    return new Promise((resolve, reject) => {
        const id = String(++requestId);
        const timer = setTimeout(() => {
            requests.delete(id);
            reject(new Error("Account sharing timed out. Try again."));
        }, 15000);
        requests.set(id, response => {
            clearTimeout(timer);
            if (response.error) reject(new Error(response.error));
            else resolve(response.data);
        });
        accountBridge.send(id, action, JSON.stringify(args));
    });
}

function showInvites(invites) {
    // Avoid rebuilding buttons while the user has them focused.
    if (JSON.stringify(accountInvites) === JSON.stringify(invites)) return;
    accountInvites = invites;
    const buttons = invites.map(invite => {
        const button = document.createElement("button");
        button.textContent = "Accept from " + invite.device;
        button.onclick = () => acceptInvite(invite);
        return button;
    });
    element("invites").replaceChildren(...buttons);
}

async function refreshAccount() {
    if (refreshing || (busy && !accountSession)) return;
    refreshing = true;
    const current = generation;
    try {
        const signedIn = await signal("identity");
        if (current !== generation) return;
        if (accountSession && accountSession.account !== signedIn) {
            stopSharing("Your Notcher account changed. Start a new session.");
        }
        if (account !== signedIn) {
            accountAvailable = false;
            showInvites([]);
        }
        account = signedIn;
        updateControls();
        if (accountSession) {
            const session = accountSession;
            if (session.id && !session.answerReceived) {
                const offer = await signal("poll", session);
                if (session !== accountSession || session.answerReceived) return;
                if (!offer) {
                    stopSharing("This invitation expired or was cancelled.");
                } else if (offer.answer) {
                    session.answerReceived = true;
                    const connection = peer;
                    await connection.setRemoteDescription(decode(offer.answer, "answer"));
                    reportControlReady();
                    if (session === accountSession && connection.connectionState !== "connected") status("Connecting…");
                    signal("remove", session).catch(() => {});
                }
            }
            return;
        }
        if (peer || busy) return;
        const invites = account ? await signal("list", {account}) : [];
        if (current !== generation || busy || peer) return;
        accountAvailable = Boolean(account);
        showInvites(invites);
        updateControls();
        element("accountNotice").textContent = account
            ? (invites.length ? "" : "Waiting for an invitation…")
            : "Sign in to Notcher on both devices to use account sharing.";
    } catch (error) {
        if (current !== generation) return;
        if (accountSession) {
            stopSharing(error.message);
        } else {
            accountAvailable = false;
            showInvites([]);
            updateControls();
            element("accountNotice").textContent = error.message;
        }
    } finally {
        refreshing = false;
    }
}

function startAccountTransport(signaling, input) {
    accountBridge = signaling;
    remoteInput = input;
    remoteInput.permission_changed.connect(grant => sendControl({type: "grant", grant}));
    accountBridge.reply.connect((id, payload) => {
        const callback = requests.get(id);
        if (!callback) return;
        requests.delete(id);
        callback(JSON.parse(payload));
    });
    element("intro").textContent = "Share with another device on your Notcher account, or connect using codes.";
    element("accountShare").hidden = false;
    updateControls();
    refreshAccount();
    setInterval(refreshAccount, 3000);
}
if (typeof QWebChannel !== "undefined" && window.qt?.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, ({objects}) => {
        startAccountTransport(objects.signaling, objects.remoteInput);
    });
} else if (window.notcherConsolePrefix) {
    const subscribers = {};
    const event = name => ({connect: callback => { subscribers[name] = callback; }});
    const call = name => (...args) => console.info(window.notcherConsolePrefix + JSON.stringify([name, args]));
    window.receiveNotcherMessage = ([name, ...args]) => subscribers[name]?.(...args);
    // Run after initialization of the video and its input handlers.
    queueMicrotask(() => startAccountTransport(
        {send: call("send"), reply: event("reply")},
        {
            peer_ready: call("peer_ready"),
            heartbeat: call("heartbeat"),
            release_input: call("release_input"),
            keyboard: call("keyboard"),
            pointer: call("pointer"),
            permission_changed: event("permission_changed")
        }
    ));
}

function status(text) { element("status").textContent = text; }
function updateControls() {
    element("share").disabled = busy || peer !== null;
    element("join").disabled = busy || peer !== null;
    element("accountShare").disabled = busy || peer !== null || !accountAvailable;
    element("accountInbox").hidden = !accountBridge || busy || peer !== null || mode !== null;
    element("apply").disabled = busy || (
        mode === "sharing" && peer && peer.signalingState !== "have-local-offer"
    );
    element("stop").hidden = !peer && !busy;
}
function stopSharing(message) {
    generation++;
    viewerReady = false;
    remoteInput?.peer_ready(false);
    setViewerGrant("");

    const session = accountSession;
    accountSession = null;
    if (session?.id && !session.answerReceived) signal("remove", session).catch(() => {});
    const old = peer;
    peer = null;
    if (control && control.readyState === "open") {
        try { control.send("stop"); } catch (_) {}
    }
    control = null;
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
    if (old) old.close();
    mode = null;
    busy = false;
    element("video").srcObject = null;
    element("inbox").hidden = true;
    element("outbox").hidden = true;
    element("out").value = "";
    element("incoming").value = "";
    element("videoCaption").textContent = defaultCaption;
    status(message || "Session stopped");
    updateControls();
}
window.stopSharing = stopSharing;

function sendControl(message) {
    if (control?.readyState !== "open" || control.bufferedAmount > 65536) return;
    try { control.send(JSON.stringify(message)); } catch (_) {}
}
function sameAccountRole(role) {
    return Boolean(accountSession?.answerReceived && accountSession.account === account &&
        mode === role && peer?.connectionState === "connected" && control?.readyState === "open");
}
function reportControlReady() {
    if (!remoteInput) return;
    remoteInput.peer_ready(viewerReady && sameAccountRole("sharing"));
    if (sameAccountRole("viewing")) sendControl({type: "ready"});
}
function handleControl(message) {
    if (!message || typeof message !== "object") return;
    if (message.type === "grant" && sameAccountRole("viewing") &&
        typeof message.grant === "string" && message.grant.length <= 36) {
        setViewerGrant(message.grant);
        return;
    }
    if (!remoteInput) return;
    if (message.type === "ready" && accountSession?.id && mode === "sharing") {
        viewerReady = true;
        reportControlReady();
        return;
    }
    if (!sameAccountRole("sharing") || typeof message.grant !== "string" || message.grant.length !== 36) return;
    if (message.type === "heartbeat") remoteInput.heartbeat(message.grant);
    if (message.type === "release") remoteInput.release_input(message.grant);
    if (message.type === "key" && typeof message.code === "string" && typeof message.down === "boolean") {
        remoteInput.keyboard(message.grant, message.code, message.down);
    }
    if (message.type === "pointer" && typeof message.action === "string" &&
        Number.isFinite(message.x) && Number.isFinite(message.y) && Number.isInteger(message.value)) {
        remoteInput.pointer(message.grant, message.action, message.x, message.y, message.value);
    }
}
function setupControl(channel) {
    if (channel.label !== "session" || control) {
        channel.close();
        return;
    }
    control = channel;
    channel.onopen = reportControlReady;
    channel.onmessage = event => {
        if (channel !== control || typeof event.data !== "string") return;
        if (event.data === "stop") {
            stopSharing("The other user ended the session");
        } else if (event.data.length <= 512) {
            try { handleControl(JSON.parse(event.data)); } catch (_) {}
        }
    };
    channel.onclose = () => {
        if (channel === control && peer) stopSharing("The other user left the session");
    };
}

const video = element("video");
function setViewerGrant(grant) {
    if (viewerGrant === grant) return;
    releaseViewerInput();
    viewerGrant = grant;
    video.controls = !grant;
    element("controlFocus").hidden = !grant;
    if (grant) status("Remote control is allowed. Click the video to control the shared display.");
    else if (sameAccountRole("viewing")) status("Remote control stopped. Viewing only.");
}
function viewerInput(message) {
    if (viewerGrant && sameAccountRole("viewing")) sendControl({...message, grant: viewerGrant});
}
function releaseViewerInput() {
    viewerInput({type: "release"});
    viewerDriving = false;
    latestMove = null;
}
function pointOnVideo(event, clamp) {
    const rect = video.getBoundingClientRect();
    const scale = Math.min(rect.width / video.videoWidth, rect.height / video.videoHeight);
    const width = video.videoWidth * scale, height = video.videoHeight * scale;
    if (!(width > 0 && height > 0)) return null;
    const x = (event.clientX - rect.left - (rect.width - width) / 2) / width;
    const y = (event.clientY - rect.top - (rect.height - height) / 2) / height;
    if (!clamp && (x < 0 || x > 1 || y < 0 || y > 1)) return null;
    return {x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y))};
}
function sendPointer(action, point, value) {
    if (point) viewerInput({type: "pointer", action, ...point, value});
}
function focusRemote() {
    if (viewerGrant) {
        video.focus();
        viewerDriving = true;
        status("Remote control active. Alt+Shift+Escape releases local input.");
    }
}
element("controlFocus").onclick = focusRemote;
video.addEventListener("pointerdown", event => {
    if (!viewerGrant || event.pointerType !== "mouse" || event.button > 2) return;
    const point = pointOnVideo(event, false);
    if (!point) return;
    event.preventDefault();
    focusRemote();
    video.setPointerCapture(event.pointerId);
    sendPointer("down", point, event.button);
});
video.addEventListener("pointerup", event => {
    if (!viewerDriving || event.pointerType !== "mouse") return;
    event.preventDefault();
    sendPointer("up", pointOnVideo(event, true), event.button);
});
video.addEventListener("pointermove", event => {
    if (!viewerDriving || event.pointerType !== "mouse") return;
    latestMove = pointOnVideo(event, video.hasPointerCapture(event.pointerId));
    if (movePending) return;
    movePending = true;
    requestAnimationFrame(() => {
        movePending = false;
        if (viewerDriving) sendPointer("move", latestMove, 0);
    });
});
video.addEventListener("wheel", event => {
    if (!viewerDriving) return;
    const point = pointOnVideo(event, false);
    if (!point) return;
    event.preventDefault();
    const magnitude = amount => Math.max(1, Math.min(10, Math.round(Math.abs(amount) / 100)));
    if (event.deltaY) sendPointer("wheel", point, -Math.sign(event.deltaY) * magnitude(event.deltaY) * 120);
    if (event.deltaX) sendPointer("horizontal", point, Math.sign(event.deltaX) * magnitude(event.deltaX) * 120);
}, {passive: false});
video.addEventListener("contextmenu", event => { if (viewerGrant) event.preventDefault(); });
video.addEventListener("pointercancel", releaseViewerInput);
video.addEventListener("blur", releaseViewerInput);
window.addEventListener("blur", releaseViewerInput);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseViewerInput(); });
for (const type of ["keydown", "keyup"]) video.addEventListener(type, event => {
    if (!viewerDriving) return;
    event.preventDefault();
    if (event.code === "Escape" && event.altKey && event.shiftKey) {
        releaseViewerInput();
        element("controlFocus").focus();
        return;
    }
    viewerInput({type: "key", code: event.code, down: type === "keydown"});
});
setInterval(() => {
    if (viewerGrant) viewerInput({type: "heartbeat"});
    else if (sameAccountRole("viewing")) sendControl({type: "ready"});
}, 900);
function createPeer() {
    const connection = new RTCPeerConnection({
        iceServers: [{urls: "stun:stun.l.google.com:19302"}]
    });
    peer = connection;
    connection.ondatachannel = event => setupControl(event.channel);
    connection.ontrack = event => {
        element("video").muted = false;
        element("video").srcObject = event.streams[0] || new MediaStream([event.track]);
        element("video").play().catch(() => {});
        element("videoCaption").textContent = "Shared screen";
    };
    connection.onconnectionstatechange = () => {
        if (connection !== peer) return;
        if (connection.connectionState === "connected") {
            reportControlReady();
            element("inbox").hidden = true;
            element("outbox").hidden = true;
            status(mode === "sharing" ? "Sharing with the other user" : "Connected");
        } else if (connection.connectionState === "failed") {
            stopSharing("Could not establish a direct connection. Try the same network or a different network; some networks require a relay server.");
        } else if (connection.connectionState === "disconnected") {
            remoteInput?.peer_ready(false);
            setViewerGrant("");
            status("Connection interrupted. Waiting for the other user…");
        }
    };
    return connection;
}
function waitForIce(connection) {
    if (connection.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve, reject) => {
        const finish = error => {
            clearTimeout(timer);
            connection.removeEventListener("icegatheringstatechange", changed);
            connection.removeEventListener("connectionstatechange", changed);
            if (error) reject(error); else resolve();
        };
        const changed = () => {
            if (connection.signalingState === "closed") finish(new Error("Session stopped"));
            else if (connection.iceGatheringState === "complete") finish();
        };
        const timer = setTimeout(() => finish(new Error("Network discovery timed out. Check the connection and try again.")), 20000);
        connection.addEventListener("icegatheringstatechange", changed);
        connection.addEventListener("connectionstatechange", changed);
    });
}
function encode(description) {
    return "NS1." + btoa(JSON.stringify({version:1, type:description.type, sdp:description.sdp}));
}
function decode(text, expected) {
    const code = text.trim();
    if (!code.startsWith("NS1.") || code.length > 200000) throw new Error("This is not a valid Notcher screen-sharing code.");
    let data;
    try { data = JSON.parse(atob(code.slice(4))); }
    catch (_) { throw new Error("The code is incomplete or invalid. Copy the entire code."); }
    if (data.version !== 1 || data.type !== expected || typeof data.sdp !== "string" || !data.sdp.startsWith("v=0")) {
        throw new Error(expected === "offer" ? "Paste an invitation code from the sharing user." : "Paste the response code from the viewing user.");
    }
    return {type:data.type, sdp:data.sdp};
}
function output(description, title, instruction) {
    element("outputLabel").textContent = title;
    element("out").value = encode(description);
    element("instructions").textContent = instruction;
    element("outbox").hidden = false;
}
async function perform(action) {
    if (busy) return;
    busy = true;
    const current = generation;
    updateControls();
    try { await action(current); }
    catch (error) {
        if (current === generation) {
            const message = error.name === "NotAllowedError" ? "Screen sharing was cancelled or permission was denied." : error.message;
            stopSharing(message);
        }
    } finally {
        if (current === generation) {
            busy = false;
            updateControls();
        }
    }
}
function startSharing(withAccount) {
    const signedIn = account;
    return perform(async current => {
        mode = "sharing";
        const captured = await navigator.mediaDevices.getDisplayMedia({
            video: {frameRate:{ideal:20, max:30}}, audio:false
        });
        if (current !== generation || !busy || mode !== "sharing") {
            captured.getTracks().forEach(track => track.stop());
            return;
        }
        stream = captured;
        const connection = createPeer();
        for (const track of stream.getTracks()) {
            track.onended = () => { if (connection === peer) stopSharing("Screen sharing ended"); };
            connection.addTrack(track, stream);
        }
        setupControl(connection.createDataChannel("session"));
        element("video").muted = true;
        element("video").srcObject = stream;
        element("videoCaption").textContent = "Your shared screen";
        status("Preparing invitation…");
        await connection.setLocalDescription(await connection.createOffer());
        await waitForIce(connection);
        if (connection !== peer) return;
        if (withAccount) {
            const session = {account: signedIn};
            session.id = await signal("offer", {account: signedIn, code: encode(connection.localDescription)});
            if (current !== generation) {
                signal("remove", session).catch(() => {});
                return;
            }
            accountSession = session;
            status("Waiting for another device to accept. Open Share Screen on that device.");
            return;
        }
        output(connection.localDescription, "Invitation code", "Send this code to the other Notcher user. Paste their response code above and select Connect.");
        element("inputLabel").textContent = "Response code";
        element("apply").textContent = "Connect";
        element("inbox").hidden = false;
        status("Waiting for the other user's response");
    });
}

function acceptInvite(invite) {
    const signedIn = account;
    return perform(async current => {
        mode = "viewing";
        status("Preparing the connection…");
        const offer = await signal("get", {account: signedIn, id: invite.id});
        if (current !== generation) return;
        const connection = createPeer();
        await connection.setRemoteDescription(decode(offer, "offer"));
        await connection.setLocalDescription(await connection.createAnswer());
        await waitForIce(connection);
        if (current !== generation) return;
        await signal("answer", {account: signedIn, id: invite.id, code: encode(connection.localDescription)});
        if (current !== generation) return;
        accountSession = {account: signedIn, answerReceived: true};
        reportControlReady();
        if (connection.connectionState !== "connected") status("Connecting…");
        setTimeout(() => {
            if (connection === peer && connection.connectionState !== "connected") {
                stopSharing("The invitation did not connect. Ask the other device to try again.");
            }
        }, 30000);
    });
}

element("share").onclick = () => startSharing(false);
element("accountShare").onclick = () => startSharing(true);
element("join").onclick = () => {
    if (busy || peer) return;
    mode = "viewing";
    element("inputLabel").textContent = "Invitation code";
    element("incoming").value = "";
    element("apply").textContent = "Create response";
    element("inbox").hidden = false;
    status("Paste the invitation code from the sharing user");
    updateControls();
};
element("apply").onclick = () => perform(async () => {
    if (mode === "sharing" && peer) {
        const answer = decode(element("incoming").value, "answer");
        await peer.setRemoteDescription(answer);
        status("Connecting…");
        element("apply").disabled = true;
    } else if (mode === "viewing" && !peer) {
        const offer = decode(element("incoming").value, "offer");
        const connection = createPeer();
        status("Preparing response…");
        await connection.setRemoteDescription(offer);
        await connection.setLocalDescription(await connection.createAnswer());
        await waitForIce(connection);
        if (connection !== peer) return;
        output(connection.localDescription, "Response code", "Send this response to the sharing user so they can select Connect.");
        element("inbox").hidden = true;
        status("Send the response code to finish connecting");
    }
});
element("copy").onclick = () => {
    element("out").focus();
    element("out").select();
    status(document.execCommand("copy") ? "Code copied" : "Select the code and press Ctrl+C to copy it");
};
element("stop").onclick = () => stopSharing();
window.addEventListener("beforeunload", () => stopSharing());
</script>
</body>
</html>
